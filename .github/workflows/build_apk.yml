name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Puzzle Helper APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Generate complete Android project scaffolding and preserve custom source
        run: |
          mkdir -p /tmp/puzzle_backup
          cp -r lib /tmp/puzzle_backup/
          cp pubspec.yaml /tmp/puzzle_backup/
          cp analysis_options.yaml /tmp/puzzle_backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/puzzle_backup/AndroidManifest.xml

          rm -rf android test
          flutter create . --project-name puzzle_helper --org com.puzzlehelper.app --platforms android

          rm -rf lib test
          cp -r /tmp/puzzle_backup/lib ./
          cp /tmp/puzzle_backup/pubspec.yaml ./
          cp /tmp/puzzle_backup/analysis_options.yaml ./
          cp /tmp/puzzle_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Ensure minSdk is at least 24 and compileSdk is 35 for camera & opencv_dart
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: |
          set +e
          ANALYZE_OUT=$(flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1)
          ANALYZE_CODE=$?
          echo "$ANALYZE_OUT"
          if [ $ANALYZE_CODE -ne 0 ]; then
            echo "$ANALYZE_OUT" | grep -E "error •" | while read -r line; do
              echo "::error::$line"
            done
            exit $ANALYZE_CODE
          fi

      - name: Build Release APK (arm64-v8a)
        run: |
          set +e
          BUILD_OUT=$(flutter build apk --release --target-platform android-arm64 2>&1)
          BUILD_CODE=$?
          echo "$BUILD_OUT"
          if [ $BUILD_CODE -ne 0 ]; then
            echo "$BUILD_OUT" | tail -n 35 | while read -r line; do
              echo "::error::$line"
            done
            exit $BUILD_CODE
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-helper-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
